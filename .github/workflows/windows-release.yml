name: Windows — testar, compilar e publicar
on:
  push:
    branches: [main]
    paths-ignore: ['mentor/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: projects-v030
      - name: Testar núcleo Rust
        run: cargo test --locked
      - name: Compilar versão de teste
        run: cargo build --locked
      - name: Preparar testes da interface
        run: |
          npm ci
          npx playwright install chromium
      - name: Testar interface e persistência
        run: python tests/run-ui.py
      - name: Compilar aplicativo Windows
        run: cargo build --release --locked
      - name: Preparar instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile dist/MicrosoftEdgeWebview2Setup.exe
          $signature = Get-AuthenticodeSignature dist/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Bootstrapper Microsoft sem assinatura válida.' }
          $version = (Select-String '^version = "([^"]+)"' Cargo.toml | Select-Object -First 1).Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer/atelier.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar o instalador.' }
          $hash = (Get-FileHash dist/Atelier-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Atelier-Setup.exe" | Out-File -Encoding ascii dist/Atelier-Setup.exe.sha256
          Copy-Item target/release/atelier-roadmap.exe dist/Atelier.exe
          "ATELIER_VERSION=$version" >> $env:GITHUB_ENV
      - name: Testar instalação silenciosa preservando dados
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'AtelierInstallTest'
          $dataDir = Join-Path $env:LOCALAPPDATA 'AtelierRoadmap'
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          '{"schemaVersion":1,"settings":{"dailyMinutes":360,"start":"09:00","days":[1,2,3,4,5],"closeBehavior":"exit","minimizeBehavior":"tray","notificationsEnabled":true},"tasks":[],"milestones":[],"revenue":[],"history":[],"appliedUpdates":[],"marker":"must-survive"}' | Set-Content (Join-Path $dataDir 'agenda.json')
          $p = Start-Process dist/Atelier-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$testDir" -PassThru
          if (!$p.WaitForExit(120000)) { throw 'O instalador não encerrou em dois minutos.' }
          if ($p.ExitCode -ne 0) { throw "Instalação falhou: $($p.ExitCode)" }
          if (!(Test-Path "$testDir/Atelier.exe")) { throw 'Executável não instalado.' }
          $app = $null
          for ($i=0; $i -lt 100; $i++) {
            $app = Get-Process Atelier -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
            if ($app) { break }
            Start-Sleep -Milliseconds 100
          }
          if (!$app -or $app.MainWindowTitle -ne 'Atelier — Roadmap') { throw 'A janela nativa não abriu.' }
          $ready = $false
          for ($i=0; $i -lt 100; $i++) {
            $statusFile = Join-Path $dataDir 'desktop-status.json'
            if (Test-Path $statusFile) {
              try { $status = Get-Content $statusFile -Raw | ConvertFrom-Json; $ready = $status.ready -and ($status.pid -eq $app.Id) } catch {}
            }
            if ($ready) { break }
            Start-Sleep -Milliseconds 200
          }
          if (!$ready) { throw 'A interface não confirmou o carregamento dos dados.' }
          if (((Get-Content (Join-Path $dataDir 'agenda.json') -Raw) | ConvertFrom-Json).marker -ne 'must-survive') { throw 'Instalação alterou dados locais.' }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public class AtelierWindowSmoke {
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);
          }
          '@
          $windowHandle = $app.MainWindowHandle
          [AtelierWindowSmoke]::PostMessage($windowHandle,0x112,[IntPtr]0xF020,[IntPtr]0) | Out-Null
          Start-Sleep -Milliseconds 1800
          if ($status.trayAvailable) {
            if ([AtelierWindowSmoke]::IsWindowVisible($windowHandle)) { throw 'A escolha bandeja não ocultou a janela.' }
          } elseif (![AtelierWindowSmoke]::IsIconic($windowHandle)) { throw 'Sem bandeja, a janela deveria permanecer na barra de tarefas.' }
          Start-Process "$testDir/Atelier.exe" | Out-Null
          Start-Sleep -Milliseconds 1500
          if (![AtelierWindowSmoke]::IsWindowVisible($windowHandle) -or [AtelierWindowSmoke]::IsIconic($windowHandle)) { throw 'Reabrir o aplicativo não restaurou a janela.' }
          $app.Refresh()
          $app.CloseMainWindow() | Out-Null
          if (!$app.WaitForExit(15000)) { throw 'Fechar janela não encerrou o aplicativo.' }
          if (((Get-Content (Join-Path $dataDir 'agenda.json') -Raw) | ConvertFrom-Json).marker -ne 'must-survive') { throw 'Fechar o aplicativo alterou os dados preservados.' }
      - name: Publicar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:ATELIER_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Versão já publicada; aumente Cargo.toml para publicar outra.'; exit 0 }
          gh release create $tag dist/Atelier-Setup.exe dist/Atelier-Setup.exe.sha256 dist/Atelier.exe --target $env:GITHUB_SHA --title "Atelier $env:ATELIER_VERSION — Windows" --notes "Atelier 0.3: gerenciamento pessoal de projetos, roadmap, tarefas, Kanban, prazos, lembretes e bandeja. Windows 10/11 x64. Instale Atelier-Setup.exe. Próximas versões: Ajustes → Checar atualização. Plano de tarefas: Ajustes → Buscar plano do mentor. Dados locais preservados."
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release.' }
