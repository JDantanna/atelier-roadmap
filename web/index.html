ct{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}#notice{position:fixed;bottom:22px;right:22px;max-width:500px;background:#354230;color:var(--text);padding:15px 22px;border:1px solid #718550;border-radius:10px;z-index:10;display:none}.warning{color:var(--orange)}a{color:var(--accent)}.timer{font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:2px;margin:12px 0}.empty{padding:22px;color:var(--muted)}@media(max-width:1000px){.shell{grid-template-columns:175px 1fr}main{padding:24px}.grid{grid-template-columns:1fr}.stats{gap:8px}.metric{font-size:25px}}@media(max-width:650px){.shell{display:block}aside{position:relative;height:auto;padding:15px}nav{display:flex;flex-wrap:wrap;margin:10px 0}.sidefoot{display:none}main{padding:18px}.two{grid-template-columns:1fr}.calendar button{min-height:70px;padding:5px}header{align-items:flex-start}.stats{grid-template-columns:1fr}}

'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='atelier-roadmap-v1',native=location.protocol==='http:'&&/^\/[a-f0-9]{32}\/$/.test(location.pathname);
let state,view='Quadro',selected=dateKey(new Date()),month=selected.slice(0,7),weekOffset=0,active=null,saveChain=Promise.resolve(),pendingWrites=0,importMode='update';
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDate(s){return new Date(s+'T12:00:00')}
function shift(s,n){let d=parseDate(s);d.setDate(d.getDate()+n);return dateKey(d)}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d\d-\d\d$/.test(s)&&dateKey(parseDate(s))===s}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function mins(n){return n>=60?`${Math.floor(n/60)}h${n%60?' '+n%60+'min':''}`:`${n}min`}
function fmt(s){return parseDate(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
const milestones=[
['2026-10-31','Oferta e direção','Revisar até oito trabalhos; definir três serviços e começar os contatos.'],
['2026-11-30','Duas amostras vendáveis','Personagem com lápis e personagem colorido. Medir tempo e testar primeiras encomendas.'],
['2026-12-31','Criatura e equipamentos','Criatura funcional e família de props do mesmo universo. Avaliar procura e preços.'],
['2027-01-31','Concept para produção','Explorações distintas, construção e detalhes suficientes para outra pessoa produzir.'],
['2027-02-28','Ilustração narrativa','Uma cena com composição, luz e materiais; buscar clientes recorrentes.'],
['2027-03-31','Meta: US$ 2.000 no mês','Priorizar os serviços que tiveram resposta e formar a próxima fila de trabalho. Meta, sem garantia de receita.']
].map((m,i)=>({id:'meta-'+i,date:m[0],title:m[1],description:m[2],done:false}));
const projectNames=['Oferta e portfólio','Personagem a lápis','Personagem colorido','Criatura e props','Concept de produção','Ilustração narrativa'];
const focus=[
['Briefing e referências','Escrever função, personalidade e três restrições. Selecionar referências com intenção.'],
['Seis silhuetas','Variar proporção, equipamento e distribuição de massas; evitar apenas trocar acessórios.'],
['Construção do design','Escolher uma direção e resolver anatomia, roupa e funcionamento dos equipamentos.'],
['Desenho e valores','Preservar linhas expressivas e organizar grandes massas de luz e sombra.'],
['Cor e revisão semanal','Testar três paletas, registrar decisões e preparar a próxima revisão.']
];
function seed(){return {schemaVersion:1,workspaceVersion:3,settings:{dailyMinutes:360,start:'09:00',days:[1,2,3,4,5],notificationsEnabled:true,minimizeBehavior:'ask',closeBehavior:'ask'},projects:[],tasks:[],milestones:[],revenue:[],history:[],appliedUpdates:[]}}
function validate(s){if(!s||s.schemaVersion!==1||!Array.isArray(s.tasks)||!Array.isArray(s.milestones)||!Array.isArray(s.revenue)||!Array.isArray(s.history)||!Array.isArray(s.appliedUpdates)||!s.settings||!validTime(s.settings.start)||!Number.isInteger(s.settings.dailyMinutes)||s.settings.dailyMinutes<1||s.settings.dailyMinutes>1440||!Array.isArray(s.settings.days)||!s.settings.days.length||s.settings.days.some(d=>!Number.isInteger(d)||d<0||d>6))throw Error('Estrutura de agenda inválida.');const ids=new Set();for(const t of s.tasks){checkTask(t);if(ids.has(t.id))throw Error('IDs de tarefa repetidos.');ids.add(t.id)}for(const m of s.milestones)if(typeof m.id!=='string'||!validDate(m.date)||typeof m.title!=='string'||typeof m.description!=='string'||typeof m.done!=='boolean')throw Error('Meta inválida.');for(const r of s.revenue)if(!validDate(r.date)||typeof r.client!=='string'||!Number.isFinite(r.amount)||r.amount<0)throw Error('Receita inválida.');return s}
function validTime(s){return typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s)}
function checkTask(t){if(!t||typeof t.id!=='string'||!t.id||!validDate(t.date)||!validTime(t.start)||typeof t.title!=='string'||!t.title.trim()||t.title.length>250||typeof t.description!=='string'||typeof t.project!=='string'||typeof t.category!=='string'||typeof t.notes!=='string'||!Number.isInteger(t.minutes)||t.minutes<1||t.minutes>1440||!Number.isFinite(t.actualSeconds)||t.actualSeconds<0||!['pending','in_progress','blocked','done'].includes(t.status))throw Error('Tarefa inválida: verifique data, horário, duração e campos obrigatórios.');}
function tell(s){$('#notice').textContent=s;$('#notice').style.display='block';clearTimeout(tell.t);tell.t=setTimeout(()=>$('#notice').style.display='none',6000)}
function persist(){let json=JSON.stringify(state);pendingWrites++;$('#storage').textContent='Salvando…';saveChain=saveChain.catch(()=>{}).then(async()=>{if(native){const r=await fetch('state',{method:'POST',headers:{'Content-Type':'application/json'},body:json});if(!r.ok)throw Error('Falha ao salvar no computador. Exporte um backup antes de fechar.')}else localStorage.setItem(key,json);}).then(()=>{pendingWrites--;if(!pendingWrites)$('#storage').textContent=native?'Salvo neste computador':'Modo de teste • dados neste navegador';},e=>{pendingWrites--;$('#storage').textContent='Erro ao salvar';tell(e.message);throw e});saveChain.catch(()=>{});return saveChain}
function record(text){state.history.unshift({at:new Date().toISOString(),text});state.history=state.history.slice(0,300)}
function tasks(d){return state.tasks.filter(t=>t.date===d).sort((a,b)=>a.start.localeCompare(b.start))}
function current(){const today=dateKey(new Date()),list=tasks(today).filter(t=>t.status!=='done');const now=new Date(),time=now.getHours()*60+now.getMinutes();return list.find(t=>{const [h,m]=t.start.split(':').map(Number);return time>=h*60+m&&time<h*60+m+t.minutes})||list[0]}
function taskHTML(t){return `<div class="task ${t.status==='done'?'done':''}"><div class="time">${esc(t.start)}<br>${mins(t.minutes)}</div><div class="content"><small>${esc(t.category)} · ${esc(t.project)}</small><h3>${esc(t.title)}</h3><small>${esc(t.description)}</small>${t.notes?`<p><small>Anotações: ${esc(t.notes)}</small></p>`:''}<div class="actions"><button data-action="toggle" data-id="${esc(t.id)}">${t.status==='done'?'Reabrir':'Concluir'}</button><button data-action="timer" data-id="${esc(t.id)}">${active?.id===t.id?'Pausar':'Cronometrar'}</button><button data-action="edit" data-id="${esc(t.id)}">Editar / remarcar</button><small>Real: ${mins(Math.floor(t.actualSeconds/60))}</small></div></div></div>`}
function draw(){const today=dateKey(new Date());$('#title').textContent=({Hoje:'Sua prática de hoje',Semana:'Uma semana de cada vez',Mês:'Visão do mês',Roadmap:'Do desenho ao mercado',Resultados:'Trabalho que vira resultado',Ajustes:'Seu ritmo de trabalho'})[view];$('#subtitle').textContent='6 horas de prática intencional • Meta de receita: US$ 2.000/mês em março de 2027';$('#nav').innerHTML=['Hoje','Semana','Mês','Roadmap','Resultados','Ajustes'].map((n,i)=>`<button data-view="${n}" class="${n===view?'active':''}">${['◉','▤','▦','◇','↗','⚙'][i]} &nbsp;${n}</button>`).join('');$('#subtitle').textContent=`${mins(state.settings.dailyMinutes)} de prática por dia planejado • Meta: US$ 2.000/mês em março de 2027`;
if(view==='Hoje'){const list=tasks(selected),total=list.reduce((a,t)=>a+t.minutes,0),done=list.filter(t=>t.status==='done').reduce((a,t)=>a+t.minutes,0),now=current();$('#app').innerHTML=`<div class="row between"><div class="row"><button data-action="prevday">←</button><input id="day" type="date" value="${selected}"><button data-action="nextday">→</button><button data-action="today">Hoje</button></div><small>${esc(fmt(selected))}</small></div><div class="stats"><div class="stat"><small>Planejado</small><div class="metric">${mins(total)}</div></div><div class="stat"><small>Concluído</small><div class="metric">${done?mins(done):'0min'}</div></div><div class="stat"><small>Entregas do dia</small><div class="metric">${list.filter(t=>t.status==='done').length} / ${list.length}</div></div></div><div class="grid"><section><div class="card hero"><span class="pill">${active?'SESSÃO EM ANDAMENTO':now?'PRÓXIMO FOCO DE HOJE':'AGENDA DE HOJE'}</span><h2>${esc(active?state.tasks.find(t=>t.id===active.id)?.title:now?.title||'Espaço para recuperar energia')}</h2><p>${esc(active?'Seu tempo está sendo registrado. Use Pausar antes de sair.':now?.description||'Sem tarefas pendentes hoje. Consulte a semana ou adicione uma tarefa.')}</p><div id="timer" class="timer">${clock()}</div>${active?'<button class="primary" data-action="pause">Pausar e salvar tempo</button>':now?`<button class="primary" data-action="timer" data-id="${esc(now.id)}">Iniciar sessão</button>`:''}</div><div class="card"><h2>Plano do dia selecionado</h2>${total>state.settings.dailyMinutes?'<p class="warning">O planejamento ultrapassa sua capacidade diária.</p>':''}<div class="bar"><i style="width:${total?Math.min(100,done/total*100):0}%"></i></div>${list.map(taskHTML).join('')||'<div class="empty">Nenhuma tarefa. Descanso também faz parte do plano.</div>'}</div></section><section><div class="card"><span class="eyebrow">Direção de arte</span><h2 style="margin-top:14px">Um passo bem resolvido.</h2><p>Resolva leitura e construção antes do acabamento. Preserve a força do seu lápis e pinte para explicar os volumes.</p><small>O plano inicial é uma estrutura de trabalho. Revise o briefing semanalmente e ajuste o escopo ao tempo real.</small></div><div class="card"><h2>Próximas metas</h2>${state.milestones.filter(m=>!m.done&&m.date>=today).slice(0,3).map(m=>`<p><span class="pill">${esc(m.date.split('-').reverse().join('/'))}</span><br><strong>${esc(m.title)}</strong></p>`).join('')||'<p>Metas revisadas. Defina o próximo ciclo no Roadmap.</p>'}</div><div class="card"><h3>Ponto de revisão</h3><p>Traga ao chat o desenho, o tempo gasto e a dificuldade. Depois importe o plano revisado.</p><button data-action="report">Exportar resumo para o chat</button></div></section></div>`;}
if(view==='Semana'){let d=parseDate(today);d.setDate(d.getDate()-((d.getDay()+6)%7)+weekOffset*7);let start=dateKey(d);$('#app').innerHTML=`<div class="row between"><div class="row"><button data-action="prevweek">← Semana anterior</button><button data-action="thisweek">Semana atual</button><button data-action="nextweek">Próxima →</button></div><small>${fmt(start)} — ${fmt(shift(start,6))}</small></div><p class="muted">Clique em um bloco para editar ou remarcar. As tarefas não concluídas permanecem na data original.</p><div class="week">${Array.from({length:7},(_,i)=>{let day=shift(start,i),l=tasks(day);return `<div class="day ${day===today?'today':''}"><strong>${parseDate(day).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric'})}</strong><p><small>${mins(l.reduce((a,t)=>a+t.minutes,0))} planejados</small></p>${l.map(t=>`<button class="mini ${t.status==='done'?'done':''}" data-action="edit" data-id="${esc(t.id)}">${esc(t.start)} · ${mins(t.minutes)}<br><strong>${esc(t.title)}</strong></button>`).join('')||'<small>Descanso / livre</small>'}</div>`}).join('')}</div>`;}

async function refreshUpdates(){if(!native||view!=='Ajustes')return;try{const r=await fetch('updates');if(!r.ok)return;const s=await r.json();if(!$('#update-message'))return;$('#update-message').textContent=s.message;$('#update-progress').style.width=s.percent+'%';$('#update-check').disabled=['checking','downloading','ready','installing'].includes(s.phase);$('#update-download').hidden=s.phase!=='available';$('#update-install').hidden=s.phase!=='ready';}catch{if($('#update-message'))$('#update-message').textContent='Não foi possível consultar o serviço local.';}}

async function updateAction(endpoint){if(!native){tell('Disponível no aplicativo instalado.');return}if(endpoint==='update-install'){if(active)pause();await persist();}const r=await fetch(endpoint,{method:'POST'});if(!r.ok)throw Error(await r.text());if(endpoint==='update-install'){document.body.innerHTML='<main><h1>Instalando a atualização…</h1><p>O Atelier será reaberto pelo instalador. Seus dados foram salvos.</p></main>';}else await refreshUpdates();}
function clock(){if(!active)return '00:00:00';let s=(active.sessionSeconds||0)+Math.floor((Date.now()-active.started)/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':')}

function edit(id){const t=state.tasks.find(t=>t.id===id)||{date:selected,start:state.settings.start,title:'',minutes:60,category:'Produção',project:'',description:'',notes:''};show(`<form id="taskform"><h2>${id?'Editar tarefa':'Nova tarefa'}</h2><label>Título</label><input name="title" maxlength="250" value="${esc(t.title)}" required><div class="two"><div><label>Data</label><input name="date" type="date" value="${t.date}" required></div><div><label>Início</label><input name="start" type="time" value="${t.start}" required></div></div><div class="two"><div><label>Duração em minutos</label><input name="minutes" type="number" min="1" max="1440" value="${t.minutes}" required></div><div><label>Categoria</label><select name="category">${['Estudo','Produção','Prospecção','Revisão'].map(c=>`<option ${c===t.category?'selected':''}>${c}</option>`).join('')}</select></div></div><label>Projeto</label><input name="project" value="${esc(t.project)}"><label>Objetivo e entrega</label><textarea name="description">${esc(t.description)}</textarea><label>Anotações</label><textarea name="notes">${esc(t.notes)}</textarea><div class="row"><button class="primary">Salvar tarefa</button><button type="button" data-action="close">Cancelar</button>${id?'<button type="button" id="deleteTask">Excluir</button>':''}</div></form>`);$('#taskform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),data=Object.fromEntries(f);data.minutes=Number(data.minutes);const next={...t,...data,id:id||uid(),status:t.status||'pending',actualSeconds:t.actualSeconds||0};try{checkTask(next)}catch(e){tell(e.message);return}if(id)Object.assign(t,next);else state.tasks.push(next);record('Tarefa ajustada: '+next.title);persist();$('#modal').close();draw()};if(id)$('#deleteTask').onclick=()=>{if(confirm('Excluir esta tarefa e seu registro de tempo?')){if(active?.id===id)pause();state.tasks=state.tasks.filter(t=>t.id!==id);record('Tarefa excluída: '+t.title);persist();$('#modal').close();draw()}}}
function download(name,text,type='application/json'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function updatePreview(u){if(!u||u.schemaVersion!==1||typeof u.updateId!=='string'||!u.updateId||!Array.isArray(u.tasks)||u.tasks.length>1000)throw Error('Atualização inválida. Use o formato de exemplo.');if(state.appliedUpdates.includes(u.updateId))throw Error('Esta atualização já foi aplicada.');let ids=new Set;const additions=u.tasks.map(x=>{if(!x||typeof x.id!=='string'||ids.has(x.id))throw Error('ID ausente ou repetido na atualização.');ids.add(x.id);let old=state.tasks.find(t=>t.id===x.id);const plannedStart=x.start??old?.start??(u.startPolicy==='configured-day-start'?state.settings.start:undefined);const t={status:'pending',actualSeconds:0,notes:'',description:'',project:'',category:'Produção',...old,...x,start:plannedStart};if(old){if(old.subtasks&&x.subtasks)t.subtasks=x.subtasks.map(sub=>({...sub,done:old.subtasks.find(o=>o.id===sub.id)?.done??sub.done}));t.completedAt=old.completedAt;t.status=old.status;t.actualSeconds=old.actualSeconds;t.notes=old.notes}checkTask(t);return t});show(`<h2>Revisar atualização</h2><p>${esc(u.summary||u.updateId)}</p><p>${additions.filter(t=>!state.tasks.some(o=>o.id===t.id)).length} novas tarefas; ${additions.filter(t=>state.tasks.some(o=>o.id===t.id)).length} tarefas atualizadas. Nenhuma será apagada.</p><div style="max-height:300px;overflow:auto">${additions.map(t=>`<p><strong>${esc(t.title)}</strong><br><small>${t.date} · ${t.start} · ${mins(t.minutes)} · ${esc(t.description)}</small></p>`).join('')}</div><p class="muted">Tempo real, notas e conclusão de tarefas existentes serão preservados.</p><div class="row"><button class="primary" id="apply">Aplicar atualização</button><button data-action="close">Cancelar</button></div>`);$('#apply').onclick=()=>{if(active)pause();for(const t of additions){const i=state.tasks.findIndex(o=>o.id===t.id);if(i<0)state.tasks.push(t);else state.tasks[i]={...t,status:state.tasks[i].status,actualSeconds:state.tasks[i].actualSeconds,notes:state.tasks[i].notes}}ProjectModel.migrate(state);state async function action(a,id,el){if(a==='updatecheck'){await updateAction('update-check');return}if(a==='updatedownload'){await updateAction('update-download');return}if(a==='updateinstall'){await updateAction('update-install');return}if(a==='mentor'){if(!native){tell('Disponível no aplicativo instalado.');return}tell('Buscando plano do mentor…');const r=await fetch('mentor-plan');if(!r.ok)throw Error(await r.text());updatePreview(await r.json());return}if(a==='close'){$('#modal').close();return}if(a==='edit'){edit(id);return}if(a==='timer'){timer(id);return}if(a==='pause'){pause();return}if(a==='toggle'){let t=state.tasks.find(t=>t.id===id);if(active?.id===id)pause();t.status=t.status==='done'?'pending':'done';record(`${t.status==='done'?'Concluída':'Reaberta'}: ${t.title}`);persist()}

if(a==='generate'){let count=0;const model=seed();for(let d=dateKey(new Date());d<='2027-03-31';d=shift(d,1)){if(!state.settings.days.includes(parseDate(d).getDay())||tasks(d).length)continue;let sample=model.tasks.filter(t=>t.date===d);if(!sample.length){let src=model.tasks.slice(0,4);sample=src.map(t=>({...t,date:d,id:uid()}))}let at=state.settings.start.split(':').reduce((a,v,i)=>a+Number(v)*(i?1:60),0),used=0;sample.forEach((t,i)=>{t={...t,id:uid(),minutes:i===3?state.settings.dailyMinutes-used:Math.round(t.minutes/360*state.settings.dailyMinutes)};used+=t.minutes;t.start=String(Math.floor(at/60)%24).padStart(2,'0')+':'+String(at%60).padStart(2,'0');at+=t.minutes;state.tasks.push(t);count++})}record(`${count} blocos gerados em dias sem tarefas.`);persist();tell(count+' blocos criados.');}
